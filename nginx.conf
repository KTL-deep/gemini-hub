# Конфигурация Nginx для проксирования Облачного Браузера Gemini
server {
    listen 80;
    server_name site.ktl-server.ru gem.ktl-server.ru 78.17.155.213;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSockets (Критически важно для передачи видеопотока KasmVNC и ввода с клавиатуры/мыши)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Отключение таймаутов для соединения WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Максимальный размер загружаемого файла (для загрузки файлов в Gemini)
        client_max_body_size 100M;
    }
}
