# Конфигурация Nginx для проксирования Облачного Браузера Gemini
# Замените YOUR_DOMAIN.COM на ваш домен или IP сервера

server {
    listen 80;
    server_name YOUR_DOMAIN.COM;

    # Автоматическое перенаправление на HTTPS (раскомментировать после получения SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSockets (Критически важно для передачи видеопотока KasmVNC и ввода с клавиатуры/мыши)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Отключение таймаутов для соединения WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Максимальный размер загружаемого файла (для загрузки тяжелых файлов в Gemini)
        client_max_body_size 100M;
    }
}
