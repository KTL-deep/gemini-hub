# Конфигурация Nginx для проксирования Облачного Браузера Gemini на стандартном порту 443 (HTTPS) и 80 (HTTP)

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name site.ktl-server.ru gem.ktl-server.ru 78.17.155.213;

    ssl_certificate /etc/letsencrypt/live/site.ktl-server.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/site.ktl-server.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSockets (Критически важно для передачи видеопотока KasmVNC и ввода с клавиатуры/мыши)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Отключение таймаутов для соединения WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Максимальный размер загружаемого файла (для загрузки файлов в Gemini)
        client_max_body_size 100M;
    }
}
